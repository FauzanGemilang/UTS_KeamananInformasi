{% extends "base.html" %}
{% block title %}Extract Message — SecretPic{% endblock %}
{% block content %}
<h1>Extract Message</h1>
<form method="post" enctype="multipart/form-data" class="card form">
  <label>Stego image
    <input type="file" name="image" accept=".png,.bmp,.jpg,.jpeg" required>
  </label>
  <label>Stego-key
    <input type="password" name="key" required placeholder="Masukkan key yang digunakan saat embedding">
  </label>
  <button class="button" type="submit">Ekstrak Pesan</button>
</form>
{% if extracted %}
<section class="card result">
  <h2>✓ Extraction Successful</h2>
  <pre>{{ extracted }}</pre>
</section>
{% endif %}
{% endblock %}
